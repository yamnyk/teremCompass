<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Де Теремки</title>
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Теремки">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Night field, brass dial. Teremky = hot red-orange that heats up as you aim. */
  :root {
    --bg: #14110f; --dial: #211c18; --ring: #b8925a; --fg: #efe6d8;
    --muted: #8a7f70; --hot: #ff4a2e; --gold: #ffc94a;
    --heat: 0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 40%, rgb(255 74 46 / calc(var(--heat) * .22)), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    text-align: center; -webkit-user-select: none; user-select: none;
    transition: background-color .3s;
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .dial { position: relative; width: min(86vw, 400px); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; display: block; overflow: visible;
    filter: drop-shadow(0 0 calc(var(--heat) * 22px) rgb(255 74 46 / .7)); }
  #ringOuter { stroke: var(--ring); transition: stroke .25s, stroke-width .25s; }
  #pin { filter: drop-shadow(0 0 6px rgb(255 74 46 / .9)); }
  #pinPulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { from { opacity: .7; transform: scale(.6); } to { opacity: 0; transform: scale(2.2); } }

  .dist { font-size: clamp(40px, 12vw, 64px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .dist small { font-size: .4em; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .hint { margin-top: 10px; font-size: 19px; font-weight: 700; min-height: 1.3em; color: color-mix(in srgb, var(--fg), var(--hot) calc(var(--heat) * 100%)); }
  .sub { margin-top: 6px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 17px; font-weight: 700; color: var(--bg); background: var(--ring);
    border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .err { color: var(--hot); font-size: 14px; max-width: 34ch; }

  /* LOCKED ON TERЕМKY */
  .locked #ringOuter { stroke: var(--gold); stroke-width: 6; }
  .locked .dial svg { filter: drop-shadow(0 0 28px rgb(255 201 74 / .9)); }
  .locked .dist { color: var(--gold); }
  .locked .hint { color: var(--gold); animation: wiggle .5s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: scale(1) rotate(-2deg); } to { transform: scale(1.08) rotate(2deg); } }
  .locked { background: radial-gradient(circle at 50% 40%, rgb(255 201 74 / .28), transparent 65%), var(--bg); }

  #boom {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5;
  }
  #boom span {
    font-size: clamp(56px, 20vw, 120px); font-weight: 900; letter-spacing: -.02em; color: var(--gold);
    text-shadow: 0 0 30px rgb(255 74 46 / .9), 0 4px 0 #8a3a12;
    opacity: 0; transform: scale(.3) rotate(-8deg);
  }
  #boom.go span { animation: boom 1.4s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes boom {
    0% { opacity: 0; transform: scale(.3) rotate(-8deg); }
    25% { opacity: 1; transform: scale(1.15) rotate(3deg); }
    70% { opacity: 1; transform: scale(1) rotate(-2deg); }
    100% { opacity: 0; transform: scale(1.6) rotate(0); }
  }
  #flash { position: fixed; inset: 0; background: var(--gold); opacity: 0; pointer-events: none; z-index: 4; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: .55; } to { opacity: 0; } }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }


  /* install */
  #install {
    background: transparent; color: var(--ring); border: 1.5px solid var(--ring);
    font-size: 15px; padding: 10px 20px;
  }
  .sheetBg { position: fixed; inset: 0; background: rgb(0 0 0 / .55); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 440px; background: var(--dial); border: 1px solid #3a322b; border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); text-align: left;
    animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 14px; font-size: 19px; }
  .sheet ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
  .sheet li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.4; counter-increment: s; }
  .sheet li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--ring); color: var(--bg); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
  .sheet b { color: var(--gold); }
  .sheet .ico { display: inline-block; vertical-align: -4px; width: 18px; height: 18px; }
  .sheet .warn { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .sheet button { margin-top: 18px; width: 100%; }

  @media (prefers-reduced-motion: reduce) {
    #pinPulse, .locked .hint { animation: none; }
  }
</style>
</head>
<body>
  <h1>Де Теремки?</h1>

  <div class="dial" aria-hidden="true">
    <svg viewBox="-120 -120 240 240">
      <circle r="96" fill="var(--dial)"/>
      <g id="rose">
        <g id="ticks" stroke="var(--muted)"></g>
        <text y="-70" text-anchor="middle" fill="var(--fg)" font-size="12" font-weight="700">Пн</text>
        <text y="80" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="700">Пд</text>
        <text x="76" y="4" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="700">Сх</text>
        <text x="-76" y="4" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="700">Зх</text>

        <!-- everything pointing at Teremky; rotated to bearing -->
        <g id="needle" visibility="hidden">
          <!-- ±8° target window on the rim -->
          <path d="M0,0 L-13.4,-95.1 A96,96 0 0 1 13.4,-95.1 Z" fill="var(--hot)" opacity=".18"/>
          <path d="M-13.4,-95.1 A96,96 0 0 1 13.4,-95.1" fill="none" stroke="var(--hot)" stroke-width="5" stroke-linecap="round"/>
          <!-- beam -->
          <polygon points="0,-58 8,4 0,-2 -8,4" fill="var(--hot)"/>
          <polygon points="0,52 8,4 0,-2 -8,4" fill="var(--muted)" opacity=".3"/>
          <!-- teremok pin outside the ring -->
          <g id="pin" transform="translate(0,-109)">
            <circle id="pinPulse" r="10" fill="var(--hot)"/>
            <circle r="11" fill="var(--hot)"/>
            <path d="M-6,5 V-1 L0,-7 L6,-1 V5 Z" fill="var(--bg)"/>
            <rect x="-1.6" y="0" width="3.2" height="5" fill="var(--hot)"/>
          </g>
        </g>
      </g>
      <circle id="ringOuter" r="96" fill="none" stroke-width="2.5"/>
      <circle r="5" fill="var(--ring)"/>
      <!-- fixed notch = where phone top points; pin docks here when aimed -->
      <path d="M-14,-124 L14,-124 L0,-99 Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" opacity=".85"/>
    </svg>
  </div>

  <div id="readout">
    <div class="dist" id="dist">—</div>
    <div class="hint" id="hint"></div>
    <div class="sub" id="sub">Тисни кнопку, зорієнтуємось на місцевості</div>
  </div>

  <button id="go">Знайти Теремки</button>
  <div class="err" id="err" hidden></div>
  <button id="fix" hidden>Як дати доступ</button>
  <button id="install" hidden>Встановити як апку</button>

  <div class="sheetBg" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
      <h2 id="sheetT">Закинь Теремки на головний екран</h2>
      <ol id="steps"></ol>
      <div class="warn" id="warn">Відкрив з Telegram чи Instagram? Там цієї кнопки нема. Спершу «Відкрити в Safari / в браузері», потім усе як вище.</div>
      <button id="sheetClose">Зрозумів</button>
    </div>
  </div>

  <div id="flash"></div>
  <div id="boom"><span>ЮХУУУ!</span></div>
  <canvas id="fx"></canvas>

<script>
const TEREMKY = { lat: 50.3667, lon: 30.4547 }; // ст. м. Теремки, Київ
const LOCK_IN = 6, LOCK_OUT = 12;              // hysteresis, degrees
const $ = id => document.getElementById(id);
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const root = document.documentElement;

// ticks
const ticks = $('ticks');
for (let i = 0; i < 72; i++) {
  const a = rad(i * 5), big = i % 6 === 0;
  const r1 = big ? 84 : 88, r2 = 92;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', Math.sin(a) * r1); l.setAttribute('y1', -Math.cos(a) * r1);
  l.setAttribute('x2', Math.sin(a) * r2); l.setAttribute('y2', -Math.cos(a) * r2);
  l.setAttribute('stroke-width', big ? 1.6 : .8);
  ticks.appendChild(l);
}

function bearing(a, b) {
  const φ1 = rad(a.lat), φ2 = rad(b.lat), Δλ = rad(b.lon - a.lon);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function distanceKm(a, b) {
  const R = 6371, dφ = rad(b.lat - a.lat), dλ = rad(b.lon - a.lon);
  const h = Math.sin(dφ/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dλ/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let target = null, heading = null, shownRose = 0, shownNeedle = 0, lastOrient = 0;
let locked = false, lastBoom = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const norm = a => ((a % 360) + 540) % 360 - 180;

/* ---------- celebration ---------- */
let audio;
function ding() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * .09);
      g.gain.linearRampToValueAtTime(.18, t + i * .09 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + i * .09 + .5);
      o.connect(g).connect(audio.destination); o.start(t + i * .09); o.stop(t + i * .09 + .55);
    });
  } catch {}
}
const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [];
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', sizeFx); sizeFx();
function confetti() {
  if (reduce) return;
  const r = document.querySelector('.dial').getBoundingClientRect();
  const cx = (r.left + r.width / 2) * devicePixelRatio, cy = (r.top + r.height * .05) * devicePixelRatio;
  const cols = ['#ffc94a', '#ff4a2e', '#efe6d8', '#b8925a', '#3d8bff'];
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 10) * devicePixelRatio;
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6 * devicePixelRatio,
      s: (4 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: cols[i % cols.length], life: 1 });
  }
}
function drawFx() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .35 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .008;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
  }
}
function replay(el) { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
const CHEERS = ['ЮХУУУ!', 'ТЕРЕМКИ!', 'ОСЬ ВОНИ!', 'ВАУ!'];
function celebrate() {
  if (Date.now() - lastBoom < 2500) return;   // no spam if you wobble on the edge
  lastBoom = Date.now();
  $('boom').firstElementChild.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  replay($('boom')); replay($('flash'));
  confetti(); ding();
  navigator.vibrate?.([40, 30, 40, 30, 160]);
}

/* ---------- main loop ---------- */
function frame() {
  const k = reduce ? 1 : 0.22;
  if (heading !== null) shownRose += norm(-heading - shownRose) * k;
  if (target !== null) shownNeedle += norm(target - shownNeedle) * k;
  // SVG attr rotates around (0,0) = dial centre (CSS transform-origin breaks in iOS WebKit)
  $('rose').setAttribute('transform', `rotate(${shownRose.toFixed(2)})`);
  $('needle').setAttribute('transform', `rotate(${shownNeedle.toFixed(2)})`);

  if (target !== null && heading !== null) {
    const off = norm(target - heading), a = Math.abs(off);
    root.style.setProperty('--heat', Math.max(0, 1 - a / 90).toFixed(3));
    if (!locked && a < LOCK_IN) { locked = true; document.body.classList.add('locked'); celebrate(); }
    else if (locked && a > LOCK_OUT) { locked = false; document.body.classList.remove('locked'); }
    $('hint').textContent = locked ? 'Теремки прямо перед тобою 🎯'
      : a < 25 ? `Майже! ${off > 0 ? 'Трохи праворуч →' : '← Трохи ліворуч'}`
      : a < 90 ? `Тепліше… ${off > 0 ? 'праворуч' : 'ліворуч'} ${Math.round(a)}°`
      : `Холодно. Розвернись ${off > 0 ? 'праворуч' : 'ліворуч'} на ${Math.round(a)}°`;
  }
  drawFx();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) h = e.webkitCompassHeading; // iOS
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;                                   // Android
  if (h == null || isNaN(h)) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  heading = ((h + so) % 360 + 360) % 360;
  lastOrient = Date.now();
}

function fail(msg) { const el = $('err'); el.textContent = msg; el.hidden = false; }

let geoWatch = null;
function geoFixSteps() {
  if (isIOS && /CriOS/.test(ua)) return [
    `Налаштування iPhone → <b>Приватність і безпека → Служби локації</b>: увімкнено`,
    `Там же гортай до <b>Chrome</b> → <b>Коли використовується</b> + <b>Точна геолокація</b> увімкнено`,
    `Повністю закрий Chrome (свайп з перемикача апок), відкрий сайт знову`];
  if (isIOS) return [
    `Налаштування → <b>Приватність і безпека → Служби локації</b> → <b>Вебсайти Safari</b> (або «Safari») → <b>Коли використовується</b>`,
    `У Safari тисни <b>аА</b> / іконку ліворуч від адреси → <b>Параметри вебсайту</b> → <b>Геолокація: Дозволити</b>. Якщо колись тиснув «Заборонити», Safari пам'ятає це для сайту`,
    `Встановлена як апка з головного екрана? У неї окремий дозвіл: видали іконку, дай доступ у Safari, додай знову`];
  if (isAndroid) return [
    `Тисни 🔒 ліворуч від адреси → <b>Дозволи</b> → <b>Місцезнаходження: Дозволити</b>`,
    `Налаштування телефону → <b>Місцезнаходження</b> увімкнено, браузеру дозволено`,
    `Перезавантаж сторінку`];
  return [`Тисни іконку замка біля адреси → дозволь геолокацію → перезавантаж`];
}
function onGeoErr(err) {
  if (err.code === 1) {
    fail(`Браузер каже: геолокацію заборонено (${err.message || 'PERMISSION_DENIED'}). Це блок на рівні системи або сайту, не апки.`);
    $('fix').hidden = false; $('go').hidden = false; $('go').textContent = 'Спробувати ще';
  } else if (err.code === 3) {
    fail('GPS не встиг. Вийди ближче до вікна або надвір, тисни ще раз.');
    $('go').hidden = false; $('go').textContent = 'Спробувати ще';
  } else fail('Не можу визначити місце: ' + (err.message || 'невідома помилка'));
}
async function start() {
  $('err').hidden = true;
  // unlock audio inside the tap (iOS)
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const p = await DeviceOrientationEvent.requestPermission();
      if (p !== 'granted') fail('Компас заборонений. Стрілка покаже азимут, але не крутитиметься. Дозволь «Рух і орієнтація» і перезавантаж.');
    } catch { fail('Не вдалось запитати доступ до компаса.'); }
  }
  addEventListener('deviceorientationabsolute', onOrient);
  addEventListener('deviceorientation', onOrient);
  setTimeout(() => { if (!lastOrient) fail('Компас мовчить. Відкрий у Safari/Chrome, не в Telegram, і покрути телефон вісімкою.'); }, 3000);

  if (!navigator.geolocation) return fail('Геолокація недоступна в цьому браузері.');
  $('sub').textContent = 'Шукаю, де ти є…';
  if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch);
  geoWatch = navigator.geolocation.watchPosition(pos => {
    const me = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    const first = target === null;
    target = bearing(me, TEREMKY);
    if (first) shownNeedle = target;
    $('needle').setAttribute('visibility', 'visible');
    const km = distanceKm(me, TEREMKY);
    $('dist').innerHTML = km < 1
      ? `${Math.round(km * 1000)}<small>м</small>`
      : `${Math.round(km).toLocaleString('uk-UA')}<small>км</small>`;
    $('sub').textContent = km < 0.3 ? 'Ти на Теремках. Можна видихнути.' : `до Теремків · азимут ${Math.round(target)}°`;
    $('go').hidden = true; $('fix').hidden = true; $('err').hidden = true;
  }, onGeoErr,
  { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });

  try { await navigator.wakeLock?.request('screen'); } catch {}
}
$('go').addEventListener('click', start);

/* ---------- install ---------- */
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
const SHARE = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const DOTS = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
let deferred = null;

function stepsHTML() {
  if (isIOS && /CriOS/.test(ua)) return [
    `Тисни ${SHARE} <b>Поділитися</b> справа в адресному рядку`,
    `Гортай вниз → <b>Додати на початковий екран</b>`,
    `Тисни <b>Додати</b>. Готово, Теремки в кишені`];
  if (isIOS) return [
    `Тисни ${SHARE} <b>Поділитися</b> (знизу, або в меню «•••» біля адреси)`,
    `Гортай вниз → <b>На початковий екран</b> (може ховатися під «Показати більше»)`,
    `Перемикач <b>Відкрити як вебпрограму</b> лиши увімкненим і тисни <b>Додати</b>`];
  if (isAndroid) return [
    `Тисни ${DOTS} меню браузера справа вгорі`,
    `<b>Встановити застосунок</b> або <b>Додати на головний екран</b>`,
    `Підтверди. Іконка з'явиться серед апок`];
  return [
    `У Chrome / Edge: іконка встановлення справа в адресному рядку`,
    `Або меню ${DOTS} → <b>Встановити «Де Теремки»</b>`,
    `Safari на маку: <b>Файл → Додати в Dock</b>`];
}
function openSheet(title = 'Закинь Теремки на головний екран', steps = stepsHTML()) {
  $('sheetT').textContent = title;
  $('warn').hidden = steps !== undefined && title !== 'Закинь Теремки на головний екран';
  $('steps').innerHTML = steps.map(t => `<li><span>${t}</span></li>`).join('');
  $('sheet').hidden = false;
}
$('fix').addEventListener('click', () => openSheet('Як увімкнути геолокацію', geoFixSteps()));
$('sheetClose').addEventListener('click', () => $('sheet').hidden = true);
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').hidden = true; });

addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').hidden = isStandalone; });
addEventListener('appinstalled', () => { deferred = null; $('install').hidden = true; });
$('install').addEventListener('click', async () => {
  if (deferred) { deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('install').hidden = true; }
  else openSheet();
});
// iOS never fires beforeinstallprompt, so the button always leads to the manual steps there
if (!isStandalone && (isIOS || isAndroid)) $('install').hidden = false;


// debug on desktop: ?demo → fake GPS + slow spin, so you can see the boom without a phone
if (location.search.includes('demo')) {
  target = 57; shownNeedle = 57; $('needle').setAttribute('visibility', 'visible');
  $('dist').innerHTML = '3 139<small>км</small>'; $('go').hidden = true;
  let h = 0; setInterval(() => { h = (h + 1.5) % 360; heading = h; }, 30);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
</body>
</html>
